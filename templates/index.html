<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Port Scanner</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1 class="glitch">Port Scanner</h1>

  <div class="scanner">
    <div class="input-group">
      <label for="target" class="typing">Target IP or Domain</label>
      <input id="target" type="text" class="input-box" placeholder="e.g. 192.168.1.1" />
    </div>

    <div class="input-group">
      <label for="num_ports" class="typing">Number of Ports (1-65535)</label>
      <input id="num_ports" type="number" class="input-box" min="1" max="65535" value="100" />
    </div>

    <div class="input-group">
      <label for="port_range" class="typing">Port Range / List (optional)</label>
      <input
        id="port_range"
        type="text"
        class="input-box"
        placeholder="e.g. 1-1024,3306,8080"
      />
      <small class="hint-text">If provided, this overrides Number of Ports.</small>
    </div>

    <div class="input-group">
      <label for="scan_type" class="typing">Choose Scan Type</label>
      <select id="scan_type" class="input-box">
        <option value="SYN">SYN</option>
        <option value="UDP">UDP</option>
        <option value="STEALTH">STEALTH</option>
        <option value="CONNECT">CONNECT</option>
      </select>
    </div>

    <div class="input-group">
      <label for="top_ports_preset" class="typing">Top Ports Preset</label>
      <select id="top_ports_preset" class="input-box" onchange="applyTopPreset()">
        <option value="">Custom</option>
        <option value="top100">Top 100 (1-100)</option>
        <option value="top1000">Top 1000 (1-1000)</option>
        <option value="web">Web Ports</option>
        <option value="db">Database Ports</option>
        <option value="remote">Remote Access Ports</option>
      </select>
      <small class="hint-text">Preset fills Port Range automatically.</small>
    </div>

    <div class="input-group checkbox-group">
      <input type="checkbox" id="show_all" onchange="toggleResults()" />
      <label for="show_all">Show all ports <span id="toggle-status">(Only open ports)</span></label>
    </div>

    <div class="input-group checkbox-group">
      <input type="checkbox" id="include_route" checked />
      <label for="include_route">Include route table (traceroute)</label>
    </div>

    <div class="input-group checkbox-group">
      <input type="checkbox" id="scan_all_hosts" />
      <label for="scan_all_hosts">For CIDR targets, scan all discovered hosts</label>
    </div>

    <div class="button-group">
      <button onclick="startScan()" class="btn">Start Scan</button>
      <button onclick="exportToCSV()" class="btn">Export CSV</button>
      <button onclick="exportToJSON()" class="btn">Export JSON</button>
      <button onclick="exportToMarkdown()" class="btn">Export Markdown</button>
    </div>
  </div>

  <div id="progress-container" style="display: none;">
    <div id="progress-bar"></div>
    <p class="hacker-text">Scanning in progress... <span id="progress-text">0%</span> | ETA: <span id="eta-text">--</span></p>
  </div>

  <div id="output" class="output-box" style="display: none;">
    Awaiting input...
    <div id="scan-table"></div>
  </div>

  <div id="log-container" style="display: none;">
    <h3 class="hacker-text">Live Terminal Log</h3>
    <pre id="scan-log" class="matrix-text">Awaiting scan logs...</pre>
  </div>

  <div id="history-container" class="output-box">
    <h3 class="hacker-text">Recent Scans</h3>
    <div id="history-table">Loading history...</div>
  </div>

  <footer>
    <p class="hacker-text">Crafted by <span class="glitch">V33R</span> | Stay Anonymous</p>
    <div class="social-links">
      <a href="https://github.com/VeerDev-hub" target="_blank">GitHub</a> |
      <a href="https://www.linkedin.com/in/veer-pratap-singh-99a368310" target="_blank">LinkedIn</a> |
      <a href="https://instagram.com/veers.pov" target="_blank">Instagram</a>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
